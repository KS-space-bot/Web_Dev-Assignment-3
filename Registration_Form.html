<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f2f2f2;>

    <form style="background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0px 4px 12px rgba(0,0,0,0.15); width: 320px;">
        
        <h1 style="text-align: center; margin-bottom: 20px; color: #333;">Registration Form</h1>

        <label for="username" style="font-weight: bold;">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required
               style="width: 100%; padding: 8px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 6px;">

        <label for="email" style="font-weight: bold;">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required
               style="width: 100%; padding: 8px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 6px;">

        <label for="password" style="font-weight: bold;">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required
               style="width: 100%; padding: 8px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 6px;">

        <p style="font-weight: bold; margin: 10px 0;">Choose your gender:</p>
        <div style="margin-bottom: 16px;">
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </div>

        <textarea name="message" rows="4" cols="30" placeholder="Write a short bio..."
                  style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 16px;"></textarea>

        <button type="submit" 
                style="width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;">
            Register
        </button>
    </form>

</body>
</html>
